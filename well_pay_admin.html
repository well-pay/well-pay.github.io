<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Well Pay Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f7ff;color:#101b43}
button,input,textarea{font:inherit}.hidden{display:none!important}
header{background:linear-gradient(150deg,#061b7d,#0746dc);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px}
header button{background:#ffffff26;border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
#login{max-width:360px;margin:12vh auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #071b6320}
#login h2{margin:0 0 14px}input,textarea{width:100%;border:1.5px solid #e0e7fa;border-radius:12px;padding:12px;margin-bottom:10px;background:#f9fbff}
.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#0751df;color:#fff;font-weight:800;cursor:pointer}
#app{display:grid;grid-template-columns:320px 1fr;height:calc(100% - 52px)}
#list{border-right:1px solid #e0e7fa;overflow-y:auto;background:#fff}
.item{padding:14px 16px;border-bottom:1px solid #edf0f8;cursor:pointer}.item.sel{background:#eef3ff}
.item b{display:flex;justify-content:space-between;gap:8px}.item small{color:#68749a;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{background:#16c900;color:#fff;border-radius:10px;font-size:10px;padding:2px 7px;font-weight:800}
#chat{display:flex;flex-direction:column;min-width:0}#chatHead{padding:12px 18px;background:#fff;border-bottom:1px solid #e0e7fa}#chatHead small{color:#68749a}
#thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:75%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}.bubble small{display:block;font-size:10px;opacity:.65;margin-top:3px}
.bubble.user{align-self:flex-start;background:#fff;border:1px solid #e0e7fa}.bubble.admin{align-self:flex-end;background:#0751df;color:#fff}
#bar{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e0e7fa}#bar textarea{margin:0;height:48px;resize:none}#bar button{width:90px}
.empty{color:#7884a2;text-align:center;margin:auto;padding:30px}
@media(max-width:700px){#app{grid-template-columns:1fr}#chat{display:none}#app.open #list{display:none}#app.open #chat{display:flex}#back{display:inline-block!important}}
</style></head><body>
<div id="login"><h2>Well Pay Admin</h2><input id="em" type="email" placeholder="Admin email" autocapitalize="none"><input id="pw" type="password" placeholder="Password"><button class="btn" id="go">Log in</button><p><a href="#" id="fp" style="font-size:13px;color:#0751df">Forgot password?</a></p><p id="err" style="color:#c00;font-size:13px"></p></div>
<div id="main" class="hidden"><header><span><button id="back" style="display:none;margin-right:8px">‹</button>Support Inbox</span><span><button id="tabMsg">Messages</button> <button id="tabAnn">Announcements</button> <button id="out">Log out</button></span></header>
<div id="ann" class="hidden" style="padding:16px;max-width:640px;margin:0 auto;overflow-y:auto;height:calc(100% - 52px)"><h3>Send an announcement to all users</h3><input id="annTitle" placeholder="Title (e.g. New data prices)"><textarea id="annBody" rows="4" placeholder="Message"></textarea><button class="btn" id="annSend">Send to everyone</button><p id="annMsg" style="font-size:13px"></p><h3>Sent announcements</h3><div id="annList"></div></div>
<div id="app"><div id="list"></div><div id="chat"><div id="chatHead"><b id="who">Select a conversation</b><br><small id="meta"></small></div><div id="thread"><div class="empty">Choose a customer on the left to read and reply.</div></div><div id="bar" class="hidden"><textarea id="reply" placeholder="Type your reply..."></textarea><button class="btn" id="send">Send</button></div></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Paste the SAME Firebase config you used in the Well Pay app */
const FIREBASE={apiKey:'AIzaSyAao5u8qIQthcpqGw8YOgsW_XEMHV3lgWY',authDomain:'well-pay-ee8c3.firebaseapp.com',projectId:'well-pay-ee8c3',appId:'1:198988735407:web:be4fbed1a992a01def455a'};
const ADMIN_EMAIL='shedrackmathew51@gmail.com'; /* must match the email in your Firestore rules */
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!FIREBASE.apiKey){$('err').textContent='Add your Firebase config at the top of this file first.'}
else{
firebase.initializeApp(FIREBASE);const auth=firebase.auth(),db=firebase.firestore();
let unList=null,unThread=null,cur=null,chats=[];
$('go').onclick=async()=>{$('err').textContent='';try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}catch(e){const m={'auth/invalid-credential':'Wrong email or password. If you registered this email in the Well Pay app, use that same password (or tap Forgot password).','auth/invalid-email':'Enter a valid email.','auth/too-many-requests':'Too many attempts. Wait a few minutes.','auth/network-request-failed':'No internet connection.'};$('err').textContent=m[e.code]||('Login failed: '+(e.code||e.message))}};
$('out').onclick=()=>auth.signOut();
$('fp').onclick=async e=>{e.preventDefault();const em=$('em').value.trim();if(!em){$('err').textContent='Type your admin email above first.';return}try{await auth.sendPasswordResetEmail(em);$('err').style.color='#0a7a1c';$('err').textContent='If that email has an account, a reset link was sent.'}catch(x){$('err').textContent='Could not send reset email.'}};
$('tabMsg').onclick=()=>{$('app').classList.remove('hidden');$('ann').classList.add('hidden')};
$('tabAnn').onclick=()=>{$('app').classList.add('hidden');$('ann').classList.remove('hidden')};
$('annSend').onclick=async()=>{const title=$('annTitle').value.trim(),body=$('annBody').value.trim();if(!title||!body){$('annMsg').textContent='Write a title and a message.';return}try{await db.collection('notifications').add({title,body,ts:Date.now()});$('annTitle').value='';$('annBody').value='';$('annMsg').style.color='#0a7a1c';$('annMsg').textContent='Sent. Every user will see it in their notifications.'}catch(e){$('annMsg').style.color='#c00';$('annMsg').textContent='Could not send. Check your Firestore rules.'}};
let unAnn=null;
auth.onAuthStateChanged(u=>{if(unAnn){unAnn();unAnn=null}const ok=u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();if(ok)unAnn=db.collection('notifications').orderBy('ts','desc').limit(50).onSnapshot(q=>{$('annList').innerHTML=q.docs.map(d=>{const a=d.data();return`<div style="background:#fff;border:1px solid #e0e7fa;border-radius:12px;padding:12px;margin-bottom:8px"><b>${esc(a.title)}</b><br>${esc(a.body)}<br><small style="color:#68749a">${new Date(a.ts).toLocaleString()}</small> <button data-del="${d.id}" style="float:right;border:0;background:#ffe3e3;color:#a32020;border-radius:8px;padding:4px 10px">Delete</button></div>`}).join('')||'<div class="empty">None yet.</div>'})});
$('annList').onclick=e=>{const id=e.target.dataset.del;if(id&&confirm('Delete this announcement?'))db.collection('notifications').doc(id).delete()};
auth.onAuthStateChanged(u=>{
  const ok=u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();
  if(u&&!ok){auth.signOut();$('err').textContent='This account is not an admin.';return}
  $('login').classList.toggle('hidden',!!ok);$('main').classList.toggle('hidden',!ok);
  if(unList){unList();unList=null}if(unThread){unThread();unThread=null}
  if(ok)unList=db.collection('chats').orderBy('updated','desc').onSnapshot(q=>{chats=q.docs.map(d=>({id:d.id,...d.data()}));renderList()});
});
function renderList(){
  $('list').innerHTML=chats.length?chats.map(c=>`<div class="item ${c.id===cur?'sel':''}" data-id="${c.id}"><b><span>${esc(c.name||'Customer')}</span>${c.unreadAdmin?'<span class="dot">NEW</span>':''}</b><small>${esc(c.lastFrom==='admin'?'You: ':'')}${esc(c.lastText||'')}</small></div>`).join(''):'<div class="empty">No messages yet.</div>';
}
$('list').onclick=e=>{const it=e.target.closest('.item');if(it)openThread(it.dataset.id)};
$('back').onclick=()=>$('app').classList.remove('open');
function openThread(id){
  cur=id;const c=chats.find(x=>x.id===id)||{};renderList();$('app').classList.add('open');$('bar').classList.remove('hidden');
  $('who').textContent=c.name||'Customer';$('meta').textContent=[c.email,c.phone].filter(Boolean).join(' · ');
  db.collection('chats').doc(id).set({unreadAdmin:false},{merge:true});
  if(unThread)unThread();
  unThread=db.collection('chats').doc(id).collection('messages').orderBy('ts').onSnapshot(q=>{
    $('thread').innerHTML=q.docs.map(d=>{const m=d.data();return`<div class="bubble ${m.from==='admin'?'admin':'user'}">${esc(m.text)}<small>${new Date(m.ts).toLocaleString()}</small></div>`}).join('')||'<div class="empty">No messages.</div>';
    $('thread').scrollTop=$('thread').scrollHeight;
  });
}
async function send(){
  const text=$('reply').value.trim();if(!text||!cur)return;$('reply').value='';const ts=Date.now();
  const ref=db.collection('chats').doc(cur);
  await ref.collection('messages').add({from:'admin',text,ts});
  await ref.set({updated:ts,lastText:text,lastFrom:'admin',unreadUser:true,unreadAdmin:false},{merge:true});
}
$('send').onclick=send;
$('reply').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
}
</script></body></html>
